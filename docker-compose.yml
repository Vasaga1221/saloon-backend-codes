services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql+psycopg://aura:aura@db:5432/aura
      APP_ENV: local
      OTP_DEV_ECHO: "true"
    ports: ["8000:8000"]

volumes:
  pgdata:
